
name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify CLI
        run: autorecon --help

      - name: Test XML import and JSON export
        run: |
          autorecon --xml tests/sample_nmap.xml --format both --output reports/ci

      - name: Run automated tests
        run: python -m pytest -v
